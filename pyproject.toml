[project]
name = "idd-forecast-mbp"
version = "0.0.1"
description = "Word"
license = "BSD-3-Clause"
readme = "README.md"
authors = [
    {name = "Bobby Reiner", email = "bcreiner@uw.edu"},
]
requires-python = ">=3.12,<4"
dependencies = [
    "click>=8.1",
    "numpy>=2.2.5",
    "geopandas>=1.0.1",
    "rra-tools>=1.0.25",
    "rasterio>=1.4.3",
    "xarray>=2025.4.0",
    "scipy>=1.15.2",
    "netcdf4>=1.7.2",
    "rasterra>=0.6.2",
    "climate-data",
    "openpyxl>=3.1.5",
    "seaborn>=0.13",
    "scikit-learn>=1.8",
    "pygam>=0.12",
    "pyreadr>=0.5.6",
    "nbconvert>=7.17.1",
    "cartopy>=0.25",
    # -- previously undeclared but imported by src/ (declared 2026-08-09) --
    "pandas>=2.2",
    "matplotlib>=3.10",
    "pyarrow>=23.0",
    "pyyaml>=6.0",
    "shapely>=2.1",
    "h5py>=3.16",
    # PyTables: pandas .to_hdf/.read_hdf runtime backend (lib/io/hdf5.py) —
    # never imported directly, so invisible to import scans
    "tables>=3.11",
    "joblib>=1.5",
    "tqdm>=4.67",
    "pillow>=11.2",
    "affine>=2.4",
    "idd-tools>=0.1",
    # cluster-only leaf pipeline: jobmon is a core dep (fleet pin)
    "jobmon_installer_ihme==10.12.2",
    # NOTE: db-queries (imported by 00_pull_raw_data/get_gbd_data.py) is
    # deliberately NOT declared: its transitive ihme-rules sdist fails to
    # build on Python 3.12, and it was never installed in this repo's env.
]

[project.optional-dependencies]
# Imported only by notebooks/, not by library code.
notebooks = [
    "dask>=2026.1",
    "psutil>=7.0",
    "statsmodels>=0.14",
    "sympy",
    "pymupdf",
]

[project.urls]
homepage = "https://bcreiner.github.io/idd-forecast-mbp"
repository = "https://github.com/bcreiner/idd-forecast-mbp"
documentation = "https://bcreiner.github.io/idd-forecast-mbp"

[project.scripts]
my-cli = "idd_forecast_mbp.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "mkdocs-material>=9.6",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.9.7",
    "mkdocstrings[python]",
    "mkdocs-table-reader-plugin",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
    "mkdocs-section-index",
    "pymdown-extensions",
    "pytest-github-actions-annotate-failures",
    "pytest-cov",
    "python-kacl",
    "ipykernel>=7",
]

# IHME-internal artifactory — required for jobmon_installer_ihme.
# NOT explicit: internal packages pull internal-only TRANSITIVE deps, and uv
# source pins cover direct deps only — explicit = true makes those transitives
# unresolvable. As a non-explicit index uv consults ihme before default PyPI,
# so internal names resolve here and public names fall through.
[[tool.uv.index]]
name = "ihme"
url = "https://artifactory.ihme.washington.edu/artifactory/api/pypi/pypi-shared/simple"

[tool.uv.sources]
jobmon_installer_ihme = { index = "ihme" }
climate-data = { path = "../climate-data", editable = true }
idd-tools = { path = "../idd-tools", editable = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312" # The lowest supported version

[tool.ruff.lint]
# By default, enable all the lint rules.
# Add to the ignore list below if you don't want some rules.
# If you need some ignores for certain modules, see tool.ruff.lint.per-file-ignores below.
# For individual ignore cases, prefer inline `# noqa`s within the code.
select = ["ALL"]
ignore = [
    "COM812",   # flake8 missing trailing comma, formatter handles
    "ISC001",   # Implicit string concatenation
    "ANN",      # Type hints related, let mypy handle these.
    "D",        # Docstrings related, way too strict to our taste
    "RUF007",   # zip is idiomatic, this is a dumb check
    "RET505",   # Else after return, makes a lot of false positives
    "E501",     # Line too long, this is autoformatted
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",     # "Use of `assert` detected"
    "ARG",      # "Unused function argument". Fixtures are often unused.
    "S105",     # "Possible hardcoded password".
]
"scripts/**" = [
    "INP001",   # "Scripts are not part of a package."
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
    "classmethod",
    "pydantic.validator",
    "pydantic.root_validator",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
addopts = """\
    --cov idd_forecast_mbp \
    --cov tests \
    --cov-report term-missing \
    --no-cov-on-fail \
"""
markers = [
    "slow: marks tests that load large pipeline data files (deselect with '-m not slow')",
]

[tool.coverage.run]
omit = [
    # Legacy *_functions.py modules — being phased out, not unit-testable
    "src/idd_forecast_mbp/*_functions.py",
    # Legacy/misc top-level modules with no active unit tests
    "src/idd_forecast_mbp/data.py",
    "src/idd_forecast_mbp/cli.py",
    # Stage pipeline scripts — integration-tested via slow tests, not unit-testable
    "src/idd_forecast_mbp/01_map_to_admin_2/[0-9]*.py",
    "src/idd_forecast_mbp/01_map_to_admin_2/pixel_*.py",
    "src/idd_forecast_mbp/01_map_to_admin_2/run_suitability_pipeline.py",
    "src/idd_forecast_mbp/02_data_prep/[0-9]*.py",
    # Script-level test helper (not a pytest module)
    "tests/compare_outputs.py",
    # Package smoke test — no logic to unit-test
    "tests/test_idd_forecast_mbp.py",
    # Slow integration tests — only run with -m slow
    "tests/02_data_prep/test_02a_fhs_population.py",
    "tests/02_data_prep/test_02b_full_population.py",
]

[tool.coverage.report]
fail_under = 100
exclude_lines = [
    'if TYPE_CHECKING:',
    'pragma: no cover'
]

[tool.mypy]
# This is the global mypy configuration.
# Avoid changing this!
strict = true  # See all the enabled flags `mypy --help | grep -A 10 'Strict mode'`
disallow_any_unimported = false

# If you need to ignore something for some specific module,
# add overrides for them. Avoid changing the global config!
# For example:
# [[tool.mypy.overrides]]
# module = [
#  "my_unpyted_dependency1.*",
#  "my_unpyted_dependency2.*"
# ]
# ignore_missing_imports = true
